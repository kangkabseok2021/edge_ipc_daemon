name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── C++ x86 — GoogleTest with real libsystemd ─────────────────────────────
  cpp-x86:
    name: C++ x86 (GoogleTest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install libsystemd-dev
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libsystemd-dev

      - name: Configure
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DSTUB_DBUS=OFF \
            -DCMAKE_POLICY_DEFAULT_CMP0135=NEW

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure -V

  # ── C++ ASan — AddressSanitizer + UBSan ───────────────────────────────────
  cpp-asan:
    name: C++ ASan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install libsystemd-dev
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libsystemd-dev

      - name: Configure with ASan
        run: |
          cmake -B build-asan -S . \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DSTUB_DBUS=OFF \
            -DENABLE_ASAN=ON \
            -DCMAKE_POLICY_DEFAULT_CMP0135=NEW

      - name: Build
        run: cmake --build build-asan -j$(nproc)

      - name: Test under ASan
        run: ctest --test-dir build-asan --output-on-failure -V
        env:
          ASAN_OPTIONS: detect_leaks=0

  # ── C++ ARM64 cross-compile check ─────────────────────────────────────────
  cpp-arm64:
    name: C++ ARM64 cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM64 cross-compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Cross-compile (STUB_DBUS=ON, no tests)
        run: |
          cmake -B build-arm64 -S . \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-arm64.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DSTUB_DBUS=ON \
            -DBUILD_TESTS=OFF \
            -DCMAKE_POLICY_DEFAULT_CMP0135=NEW
          cmake --build build-arm64 --target edge_ipc_daemon -j$(nproc)

  # ── Python pydbus (xfail on CI, no system bus) ────────────────────────────
  python:
    name: Python pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run pytest (pydbus tests xfail without system bus)
        run: uv run pytest pydbus_tests/ -v --tb=short

  # ── SDN: gRPC C++ unit tests ──────────────────────────────────────────────
  sdn-grpc-tests:
    name: SDN gRPC C++ tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install gRPC + OpenSSL + GTest deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgrpc++-dev libprotobuf-dev protobuf-compiler-grpc \
            libssl-dev libsystemd-dev \
            libgtest-dev libgmock-dev

      - name: Install cpp-httplib + nlohmann-json
        run: |
          sudo apt-get install -y --no-install-recommends \
            libcpp-httplib-dev nlohmann-json3-dev || true
          # Fallback: download httplib.h if package unavailable
          if [ ! -f /usr/include/httplib.h ] && [ ! -f /usr/local/include/httplib.h ]; then
            sudo curl -sSL https://raw.githubusercontent.com/yhirose/cpp-httplib/v0.15.3/httplib.h \
                 -o /usr/local/include/httplib.h
          fi

      - name: Configure (standalone SDN build)
        run: |
          cmake -B build/sdn -S secure_distributed_node \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=ON

      - name: Build sdn_tests
        run: cmake --build build/sdn --target sdn_tests -j$(nproc)

      - name: Run gRPC unit tests
        run: ctest --test-dir build/sdn --output-on-failure -V

  # ── SDN: Python gRPC integration tests ────────────────────────────────────
  sdn-python-tests:
    name: SDN Python gRPC tests
    runs-on: ubuntu-22.04
    needs: [sdn-grpc-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: Install gRPC build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgrpc++-dev libprotobuf-dev protobuf-compiler-grpc \
            libssl-dev libsystemd-dev nlohmann-json3-dev

      - name: Install cpp-httplib
        run: |
          sudo apt-get install -y --no-install-recommends libcpp-httplib-dev || true
          if [ ! -f /usr/include/httplib.h ] && [ ! -f /usr/local/include/httplib.h ]; then
            sudo curl -sSL https://raw.githubusercontent.com/yhirose/cpp-httplib/v0.15.3/httplib.h \
                 -o /usr/local/include/httplib.h
          fi

      - name: Build telemetry_node binary
        run: |
          cmake -B build/sdn -S secure_distributed_node \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF
          cmake --build build/sdn --target telemetry_node -j$(nproc)

      - name: Generate certs
        run: bash secure_distributed_node/certs/gen_certs.sh

      - name: Generate Python proto stubs
        run: |
          uv sync --frozen
          uv run python -m grpc_tools.protoc \
            -I secure_distributed_node/proto \
            --python_out=secure_distributed_node/tests/test_python \
            --grpc_python_out=secure_distributed_node/tests/test_python \
            secure_distributed_node/proto/telemetry.proto

      - name: Run Python gRPC tests
        run: |
          TELEMETRY_NODE_BIN=build/sdn/telemetry_node \
          uv run pytest secure_distributed_node/tests/test_python/ -v --tb=short
