[project]
name = "fpga-hil"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pytest>=8.0",
]

[tool.uv]
package = false
dev-dependencies = [
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["hil"]
python_files = ["test_*.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]
