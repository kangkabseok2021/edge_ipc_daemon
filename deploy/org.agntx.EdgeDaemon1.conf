<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy context="default">
    <deny send_destination="org.agntx.EdgeDaemon"/>
    <deny receive_sender="org.agntx.EdgeDaemon"/>
  </policy>

  <policy user="edge-daemon">
    <allow own="org.agntx.EdgeDaemon"/>
    <allow send_destination="org.agntx.EdgeDaemon"/>
    <allow receive_sender="org.agntx.EdgeDaemon"/>
  </policy>

  <policy user="root">
    <allow send_destination="org.agntx.EdgeDaemon"/>
    <allow receive_sender="org.agntx.EdgeDaemon"/>
  </policy>
</busconfig>
