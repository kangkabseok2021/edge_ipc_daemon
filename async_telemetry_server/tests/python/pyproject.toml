[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ats-db-tests"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.2",
    "pytest-postgresql>=6.0",
    "psycopg2-binary>=2.9",
]

[tool.pytest.ini_options]
testpaths = ["."]
postgresql_exec = "/opt/homebrew/opt/postgresql@14/bin/pg_ctl"
