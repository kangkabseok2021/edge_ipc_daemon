[project]
name = "edge-ipc-daemon-tests"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0",
    "pydbus>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pydbus_tests"]

[tool.pytest.ini_options]
testpaths = ["pydbus_tests"]
pythonpath = ["secure_distributed_node/tests/test_python"]

[dependency-groups]
dev = [
    "grpcio>=1.80.0",
    "grpcio-tools>=1.80.0",
]
